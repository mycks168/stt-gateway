[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-gateway"
version = "0.1.0"
description = "FastAPI STT gateway powered by faster-whisper"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "faster-whisper>=1.0.3",
  # CTranslate2 は実行時に libcublas.so.12 (CUDA 12) を dlopen する。
  # CUDA 13 のみのホストではシステムに .so.12 が無く、推論時に
  # CUBLAS_STATUS_NOT_SUPPORTED で失敗するため同梱する。
  "nvidia-cublas-cu12>=12.4; sys_platform == 'linux'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/stt_gateway"]

[tool.coverage.report]
show_missing = true
fail_under = 80
